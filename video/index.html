<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AuraDrop promo (1920×1080, 13 s, silent)</title>
<style>
@font-face{font-family:Fredoka;src:url(../tools/fonts/Fredoka.ttf);font-weight:300 700}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}
.scene,.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
.scene{display:none;overflow:hidden}
.a{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform}
.t{font-family:Fredoka,sans-serif;font-weight:600;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.chip{font-family:Fredoka,sans-serif;font-weight:600;line-height:1;white-space:nowrap;border-radius:999px;padding:30px 54px;color:#14352A}
.card{background:#FBF8F0;border-radius:44px;width:380px;height:520px}
.pill{background:#FBF8F0;color:#14352A;font-family:Fredoka,sans-serif;font-weight:600;font-size:72px;border-radius:999px;padding:34px 84px;white-space:nowrap;line-height:1}
.ring{position:absolute;border-radius:50%;border:12px solid #8FE04A;box-sizing:border-box;left:0;top:0}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style></head>
<body><div id="stage"><div id="world"></div><div id="flash"></div></div>
<script>
const W=1920,H=1080,FPS=60,DUR=13;
const A='../assets/',L='../logo/';
const K={forest:'#14352A',leaf:'#1C9358',mint:'#3FD283',lime:'#8FE04A',cream:'#FBF8F0',gray:'#C4CAC4',coral:'#FF7A59',coralD:'#E8603F',kraft:'#D9B98A',water:'#7BD3EA'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-x,5);              // hard quint-out: fast in, dead stop
const world=document.getElementById('world'),flashEl=document.getElementById('flash');

function box(p,css,cls='a'){const d=document.createElement('div');d.className=cls;Object.assign(d.style,css||{});p.appendChild(d);return d}
function txt(p,s,size,color,css){const d=box(p,Object.assign({fontSize:size+'px',color},css),'a t');d.textContent=s;return d}
function pic(p,src,w,css){const i=document.createElement('img');i.src=src;i.className='a';i.style.width=w+'px';Object.assign(i.style,css||{});p.appendChild(i);return i}
function spark(p,size,color){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 100 100');s.setAttribute('class','a');s.style.width=s.style.height=size+'px';
  s.innerHTML=`<path d="M50 0Q62 38 100 50Q62 62 50 100Q38 62 0 50Q38 38 50 0Z" fill="${color}"/>`;p.appendChild(s);return s}
function put(el,x,y,s=1,r=0,o=1){el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s})`;el.style.opacity=o}
// slam an element in: starts offset/oversized/rotated, lands in `d` seconds with no overshoot
function enter(el,u,a,b){const d=b.d||.13;if(u<a){el.style.opacity=0;return}
  const q=1-eo(clamp((u-a)/d));
  put(el,b.x+q*(b.dx||0),b.y+q*(b.dy||0),(b.s||1)*(1+q*((b.s0||1)-1)),(b.r||0)+q*(b.r0||0),1)}
function ring(p){return box(p,{},'ring')}
function ringAt(el,cx,cy,rad,o,w=12){el.style.width=el.style.height=(rad*2)+'px';el.style.borderWidth=w+'px';el.style.transform=`translate(${cx-rad}px,${cy-rad}px)`;el.style.opacity=o}
const blank=(el)=>{el.style.opacity=0};

const scenes=[];
const scene=(bg,build,up)=>scenes.push({bg,build,up});

// 0 — YOUR PLANT / IS FADING.
scene(K.gray,r=>({p:pic(r,A+'plants/fiddle-leaf-fig-wilted.svg',640),a:txt(r,'YOUR PLANT',178,K.forest),b:txt(r,'IS FADING.',178,K.coralD)}),(u,R)=>{
  enter(R.p,u,0,{x:1380,y:620,dy:900,d:.16});enter(R.a,u,.04,{x:610,y:430,dx:-900});enter(R.b,u,.5,{x:610,y:640,dx:-900,s0:1.5});
  return {shake:[[.17,16],[.5,24]]}});

// 1 — SNAP. + flash
scene(K.forest,r=>({t:txt(r,'SNAP.',400,K.cream),c:box(r,{width:560+'px',height:560+'px',background:K.cream,borderRadius:'90px'}),i:pic(r,A+'icons/snap.svg',420)}),(u,R)=>{
  enter(R.t,u,0,{x:640,y:540,dx:-1000});enter(R.c,u,.08,{x:1560,y:540,dx:900,r0:18});enter(R.i,u,.08,{x:1560,y:540,dx:900,r0:18});
  return {shake:[[.2,16]],flash:u>=.5?Math.exp(-(u-.5)*20):0}});

// 2 — ONE PHOTO. phone
scene(K.lime,r=>({ph:pic(r,A+'ui/phone-diagnosis.svg',520),a:txt(r,'ONE',320,K.forest),b:txt(r,'PHOTO.',320,K.forest)}),(u,R)=>{
  enter(R.ph,u,0,{x:1520,y:560,r:7,dx:900,r0:28,d:.16});enter(R.a,u,.04,{x:560,y:380,dx:-1000});enter(R.b,u,.5,{x:580,y:710,dx:-1000,s0:1.4});
  return {shake:[[.17,18],[.5,22]]}});

// 3 — DIAGNOSE. scan + tags
scene(K.cream,r=>({t:txt(r,'DIAGNOSE.',236,K.forest),p:pic(r,A+'plants/fiddle-leaf-fig-wilted.svg',560),
  scan:box(r,{width:'900px',height:'10px',background:K.lime,boxShadow:'0 0 40px 14px rgba(143,224,74,.7)',borderRadius:'6px'}),
  c1:box(r,{background:K.water},'a chip'),c2:box(r,{background:K.coral},'a chip'),c3:box(r,{background:K.kraft},'a chip')}),(u,R)=>{
  [R.c1,R.c2,R.c3].forEach((c,i)=>{c.style.fontSize='84px';c.textContent=['THIRSTY','PESTS','TIRED SOIL'][i]});
  enter(R.t,u,0,{x:960,y:175,dy:-380});enter(R.p,u,0,{x:960,y:650,dy:700,d:.15});
  const sp=clamp((u-.06)/.5);put(R.scan,960,980-sp*700,1,0,u>.06&&u<.6?1:0);
  enter(R.c1,u,.32,{x:430,y:470,s0:2.4,r:-6});enter(R.c2,u,.5,{x:1500,y:610,s0:2.4,r:5});enter(R.c3,u,.68,{x:470,y:860,s0:2.4,r:-4});
  return {shake:[[.17,14],[.32,16],[.5,16],[.68,16]]}});

// 4 — DROP. box slam
scene(K.coral,r=>({t:txt(r,'DROP.',430,K.cream),b:pic(r,A+'kit/box-closed.svg',780)}),(u,R)=>{
  enter(R.t,u,0,{x:960,y:250,dy:-500});enter(R.b,u,.2,{x:960,y:740,dy:-1100,d:.11});
  return {shake:[[.17,10],[.31,38]]}});

// 5 — ONE KIT.
scene(K.kraft,r=>({t:txt(r,'ONE KIT.',240,K.forest),b:pic(r,A+'kit/box-open.svg',840),
  i:[pic(r,A+'kit/soil-bag.svg',300),pic(r,A+'kit/nutrient-drops.svg',300),pic(r,A+'kit/pest-spray.svg',300),pic(r,A+'kit/self-watering-globe.svg',300)]}),(u,R)=>{
  enter(R.t,u,0,{x:960,y:165,dy:-400});enter(R.b,u,0,{x:960,y:720,dy:900,d:.15});
  const pos=[[300,650,-8],[610,520,6],[1310,520,-6],[1620,650,8]];
  R.i.forEach((im,k)=>enter(im,u,.14+k*.14,{x:pos[k][0],y:pos[k][1],r:pos[k][2],s0:2.6,dy:-500}));
  return {shake:[[.14,12],[.28,14],[.42,14],[.56,14]]}});

// 6 — GLOW. flood + rings
scene(K.mint,r=>({t:txt(r,'GLOW.',340,K.cream),p:pic(r,A+'plants/fiddle-leaf-fig-revived.svg',740),rg:[ring(r),ring(r),ring(r)],sp:[spark(r,120,K.lime),spark(r,80,K.cream),spark(r,100,K.cream)]}),(u,R)=>{
  enter(R.t,u,.02,{x:640,y:540,dx:-1000});enter(R.p,u,0,{x:1400,y:560,s0:2.2,dy:500,d:.15});
  R.rg.forEach((g,k)=>{const q=clamp((u-.05-k*.1)/.5);ringAt(g,1400,540,120+eo(q)*900,q>0?1-q:0,14)});
  [[1120,200,.3],[1700,330,.4],[1660,880,.5]].forEach((s,k)=>enter(R.sp[k],u,s[2],{x:s[0],y:s[1],s0:3,d:.1}));
  return {shake:[[.05,26]],flash:Math.exp(-u*18)*.95}});

// 7 — before / after wipe
scene(K.gray,r=>{const gA=box(r,{},'layer'),gB=box(r,{background:'linear-gradient(160deg,#6FE3A0,#1C9358)'},'layer');
  return {gB,pa:pic(gA,A+'plants/monstera-wilted.svg',640),ta:txt(gA,'BEFORE',150,K.forest),pb:pic(gB,A+'plants/monstera-revived.svg',640),tb:txt(gB,'AFTER',150,K.cream)}},(u,R)=>{
  const p=eo(clamp((u-.5)/.14));
  R.gB.style.clipPath=`inset(0 ${100-p*100}% 0 0)`;
  enter(R.pa,u,0,{x:960,y:640,dy:800,d:.15});enter(R.ta,u,.02,{x:960,y:150,dy:-300});
  put(R.pb,960,640,1,0,1);put(R.tb,960,150,1,0,1);
  return {shake:[[.17,14],[.64,20]],flash:u>=.5?Math.exp(-(u-.5)*24)*.5:0}});

// 8 — ANY PLANT.
scene(K.cream,r=>({t:txt(r,'ANY PLANT.',250,K.forest),pl:['fiddle-leaf-fig','monstera','snake-plant','pothos','succulent','terrarium'].map(n=>pic(r,A+`plants/${n}-revived.svg`,300))}),(u,R)=>{
  enter(R.t,u,0,{x:960,y:190,dy:-400});
  R.pl.forEach((p,i)=>enter(p,u,.1+i*.1,{x:180+312*i,y:810,dy:700,d:.13}));
  return {shake:[[.1,12],[.2,10],[.3,10],[.4,10],[.5,10],[.6,14]]}});

// 9 — 4 STEPS.
scene(K.forest,r=>({t:txt(r,'4 STEPS.',170,K.mint),cards:['snap','diagnose','drop','glow'].map(n=>({c:box(r,{},'a card'),i:pic(r,A+`icons/${n}.svg`,270),l:txt(r,n.toUpperCase(),64,K.forest)}))}),(u,R)=>{
  enter(R.t,u,0,{x:960,y:120,dy:-300});
  R.cards.forEach((c,k)=>{const x=330+k*420,a=.1+k*.2,b={x,y:560,s0:1.7,dy:500};enter(c.c,u,a,b);enter(c.i,u,a,{x,y:500,s0:1.7,dy:500});enter(c.l,u,a,{x,y:730,s0:1.7,dy:500})});
  return {shake:[[.1,10],[.3,14],[.5,14],[.7,16]]}});

// 10 — SECOND / WIND.
scene(K.lime,r=>({a:txt(r,'SECOND',410,K.forest),b:txt(r,'WIND.',410,K.forest)}),(u,R)=>{
  enter(R.a,u,0,{x:960,y:370,dx:-1500});enter(R.b,u,.5,{x:960,y:760,dx:1500});
  return {shake:[[.13,24],[.63,32]]}});

// 11 — logo
scene(K.forest,r=>({rg:[ring(r),ring(r),ring(r)],lg:pic(r,L+'auradrop-logo-horizontal-reverse.svg',1500),t:txt(r,'Your plant’s second wind.',100,K.mint)}),(u,R)=>{
  R.rg.forEach((g,k)=>{const q=clamp((u-k*.12)/.6);ringAt(g,960,470,200+eo(q)*900,q>0?.6*(1-q):0,10)});
  enter(R.lg,u,0,{x:960,y:470,s0:2.6,d:.15});enter(R.t,u,.45,{x:960,y:780,dy:200,s0:1.4});
  return {shake:[[.15,30]]}});

// 12 — CTA
scene(K.leaf,r=>({a:txt(r,'GET EARLY',260,K.cream),b:txt(r,'ACCESS.',260,K.cream),p:box(r,{},'a pill'),s:[spark(r,110,K.lime),spark(r,70,K.cream)]}),(u,R)=>{
  R.p.textContent='Join the waitlist  →';
  enter(R.a,u,0,{x:960,y:290,dx:-1500});enter(R.b,u,.25,{x:960,y:560,dx:1500});enter(R.p,u,.5,{x:960,y:870,s0:2.2,dy:300});
  enter(R.s[0],u,.62,{x:150,y:150,s0:3,d:.1});enter(R.s[1],u,.72,{x:1640,y:620,s0:3,d:.1});
  return {shake:[[.13,20],[.38,26],[.6,16]]}});

scenes.forEach(s=>{const d=document.createElement('div');d.className='scene';d.style.background=s.bg;world.appendChild(d);s.root=d;s.R=s.build(d)});

window.renderAt=function(t){
  const i=Math.min(scenes.length-1,Math.floor(t)),u=t-i;
  scenes.forEach((s,k)=>s.root.style.display=k===i?'block':'none');
  const out=scenes[i].up(u,scenes[i].R)||{};
  let sx=0,sy=0;(out.shake||[]).forEach(([ti,amp])=>{if(u>=ti){const k=Math.exp(-(u-ti)*17)*amp;sx+=Math.sin(u*190)*k;sy+=Math.cos(u*163)*k*.8}});
  world.style.transform=`translate(${sx}px,${sy}px) scale(1.04)`;world.style.transformOrigin='50% 50%';
  flashEl.style.opacity=out.flash||0;
};
window.ready=Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>document.fonts.ready);
window.DURATION=DUR;window.FPS=FPS;
// browser preview: open index.html to loop it live
if(!navigator.webdriver){window.ready.then(()=>{const t0=performance.now();const sc=Math.min(innerWidth/W,innerHeight/H);document.getElementById('stage').style.transform=`scale(${sc})`;
  (function loop(n){renderAt(((n-t0)/1000)%DUR);requestAnimationFrame(loop)})(performance.now())})}
</script></body></html>
